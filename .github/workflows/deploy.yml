name: Deploy ke Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    environment: Production

    env:
      APP_DIR: ${{ vars.APP_DIR }}
      SCREEN_NAME: ${{ vars.SCREEN_NAME }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.APP_PORT }}

    steps:
      - name: Deploy
        run: |
          set -e

          APP_DIR="${APP_DIR:-/var/www/html/project/SI-SIDANG-FTTM-ITB}"
          SCREEN_NAME="${SCREEN_NAME:-sisidang}"
          APP_HOST="${APP_HOST:-0.0.0.0}"
          APP_PORT="${APP_PORT:-8000}"

          echo "==> Masuk ke $APP_DIR"
          cd "$APP_DIR"

          echo "==> Update source dari GitHub"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Composer install"
          composer install \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

          echo "==> Clear cache"
          php artisan optimize:clear

          echo "==> Optimize Laravel"
          php artisan optimize

          echo "==> Restart Laravel"

          if screen -ls "$SCREEN_NAME" 2>/dev/null | grep -q "$SCREEN_NAME"; then
            screen -S "$SCREEN_NAME" -X quit
            sleep 2
          fi

          screen -dmS "$SCREEN_NAME" \
            php artisan serve \
            --host="$APP_HOST" \
            --port="$APP_PORT"

          echo "==> DEPLOY SELESAI"